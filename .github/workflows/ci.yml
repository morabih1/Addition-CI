name: Calculator CI

# Runs on every push and every pull request (Lab 03: CI with GitHub Actions)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all unit tests
        run: python -m unittest discover -s tests -v

  demo:
    # Runs only after the tests pass
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the calculator with sample input
        run: printf '2 + 3\n5 - 8\n4 * 0\n10 / 2\n4 / 0\nq\n' | python calculator.py
